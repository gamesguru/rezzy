[package]
name = "rezzy-keyfile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "Passphrase-encrypted signing-key files and the multi-key bundle format shared by rezzy and homeservers."
keywords = ["matrix", "signing-key", "encryption", "federation"]
categories = ["cryptography"]

[features]
# Exposes `container::seal_with`, which writes key files with weak Argon2
# costs. For tests only: enable it from `[dev-dependencies]`, never in a
# normal dependency, so a shipped build cannot write a low-cost key file.
weak-kdf-for-tests = []

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
ed25519-zebra = { workspace = true, features = ["std"] }
getrandom = { workspace = true, features = ["std"] }

[lints]
workspace = true
