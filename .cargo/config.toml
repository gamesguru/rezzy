[build]
rustc-wrapper = ".cargo/cargo-wrapper.sh"

[env]
# RUSTC_WRAPPER = { value = "sccache", force = false }

# `make install` / `make build` already pass `--features cli`; use those
# rather than a bare `cargo install`/`cargo build`, which will build a
# `rezzy` binary without any TLS backend wired in (see network.rs). They
# also fall back from `tls-native` (system OpenSSL) to `tls-rustls`
# automatically — see scripts/cargo-tls-fallback.sh.
