[package]
name = "rezzy-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native C ABI for rezzy event hashing, state HAMTs, and reconciliation."
keywords = ["matrix", "state-resolution", "ffi", "c-abi"]
categories = ["api-bindings", "development-tools::ffi"]

exclude = ["examples/", "go/", "go.mod"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = { workspace = true, features = ["std"] }
rezzy = { workspace = true, default-features = false, features = ["std"] }
rezzy-recon = { workspace = true, default-features = false, features = ["std"] }

[lints]
workspace = true
